<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra cứu thông tin học sinh - Khối 6</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 15px;
            display: flex; justify-content: center; align-items: flex-start;
        }
        .app {
            background: white; border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
            padding: 22px 18px; max-width: 640px; width: 100%;
            animation: slideIn 0.4s ease-out;
        }
        @keyframes slideIn { from {opacity:0;transform:translateY(-15px);} to {opacity:1;transform:translateY(0);} }
        h1 { text-align: center; color: #333; font-size: 20px; margin-bottom: 4px; }
        .subtitle { text-align: center; color: #888; font-size: 12px; margin-bottom: 18px; }
        .school-name {
            text-align: center; font-weight: 700; color: #667eea;
            font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .section-title {
            font-size: 13px; font-weight: 700; color: #667eea;
            margin: 16px 0 10px 0; padding: 8px 10px;
            background: linear-gradient(90deg, #f0f2ff, transparent);
            border-left: 3px solid #667eea; border-radius: 6px;
        }
        .form-group { margin-bottom: 14px; position: relative; }
        label { display: block; font-weight: 600; color: #555; margin-bottom: 5px; font-size: 12.5px; }

        input[type="text"] {
            width: 100%; padding: 14px 16px; border: 2px solid #e0e0e0;
            border-radius: 10px; font-size: 17px; transition: all 0.3s ease;
            background: #fafafa; color: #333; font-family: inherit;
            letter-spacing: 1px; text-align: center;
        }
        input[type="text"]:focus {
            outline: none; border-color: #667eea; background: white;
            box-shadow: 0 0 0 4px rgba(102,126,234,0.1);
        }
        input[type="text"].invalid {
            border-color: #f44336;
            box-shadow: 0 0 0 4px rgba(244,67,54,0.1);
        }

        /* ===== AUTOCOMPLETE SUGGESTIONS ===== */
        .suggestions {
            position: absolute; top: calc(100% + 4px); left: 0; right: 0;
            background: white; border: 2px solid #e0e4f5;
            border-radius: 10px; box-shadow: 0 12px 30px rgba(0,0,0,0.15);
            max-height: 260px; overflow-y: auto; z-index: 100;
            display: none;
        }
        .suggestions.show { display: block; }
        .suggestion-item {
            padding: 11px 14px; cursor: pointer; font-size: 14px;
            color: #333; border-bottom: 1px solid #f0f0f0;
            transition: background 0.15s ease; text-align: left;
            letter-spacing: 0.2px;
        }
        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:hover,
        .suggestion-item.active { background: #f0f2ff; color: #667eea; }
        .suggestion-item .hl { font-weight: 800; color: #667eea; }
        .suggestion-item .dob-s { color: #999; font-size: 11.5px; margin-left: 4px; }
        .suggestion-empty {
            padding: 12px 14px; color: #999; font-size: 13px; text-align: center;
        }

        .hint {
            font-size: 11.5px; color: #999; margin-top: 8px;
            line-height: 1.6; text-align: center;
        }
        .hint strong { color: #667eea; }

        .btn {
            width: 100%; padding: 14px; border: none; border-radius: 12px;
            font-size: 15px; font-weight: 700; cursor: pointer;
            transition: all 0.3s ease; letter-spacing: 0.3px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; margin-top: 10px;
        }
        .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102,126,234,0.4); }

        .result-area {
            display: none;
            margin-top: 18px;
            animation: fadeIn 0.4s ease-out;
        }
        .result-area.show { display: block; }
        @keyframes fadeIn { from {opacity:0;transform:translateY(-8px);} to {opacity:1;transform:translateY(0);} }

        /* ===== STUDENT INFO ===== */
        .student-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white; border-radius: 14px; padding: 16px 18px;
            margin-bottom: 16px;
        }
        .student-header .label-small {
            font-size: 11px; opacity: 0.85; text-transform: uppercase;
            letter-spacing: 0.5px; margin-bottom: 4px;
        }
        .student-header .fullname {
            font-size: 21px; font-weight: 800; line-height: 1.3;
        }
        .student-header .sub-line {
            font-size: 12px; opacity: 0.9; margin-top: 5px;
        }

        .info-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
            margin-bottom: 8px;
        }
        .info-item {
            background: #f8f9ff; border: 2px solid #e0e4f5;
            border-radius: 12px; padding: 12px 14px;
            transition: all 0.25s ease;
        }
        .info-item:hover { border-color: #667eea; }
        .info-item.full { grid-column: 1 / -1; }
        .info-item .k {
            font-size: 11px; font-weight: 700; color: #667eea;
            text-transform: uppercase; letter-spacing: 0.3px;
            margin-bottom: 5px;
        }
        .info-item .v {
            font-size: 15px; font-weight: 700; color: #333;
            line-height: 1.35; word-break: break-word;
        }
        .info-item .v.mono {
            font-family: 'Courier New', monospace; letter-spacing: 0.5px;
        }

        /* ===== PHONE + COPY ===== */
        .phone-row {
            display: flex; align-items: center; gap: 10px;
            flex-wrap: wrap;
        }
        .phone-row .v { flex: 1 1 auto; }
        .btn-copy {
            border: none; cursor: pointer;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white; font-weight: 700; font-size: 12px;
            padding: 8px 14px; border-radius: 9px;
            transition: all 0.2s ease; white-space: nowrap;
            letter-spacing: 0.2px;
        }
        .btn-copy:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(102,126,234,0.4); }
        .btn-copy:active { transform: translateY(0); }
        .btn-copy.copied { background: linear-gradient(135deg, #4CAF50, #45a049); }

        .not-found {
            background: #fff3f3; border: 2px solid #ffcdd2;
            border-radius: 12px; padding: 18px; text-align: center;
            color: #c62828; font-weight: 600; font-size: 14px;
        }
        .not-found small {
            font-weight: 400; font-size: 12px; display: block; margin-top: 6px;
        }

        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
            padding: 12px 22px; border-radius: 12px; color: white;
            font-weight: 600; font-size: 14px; z-index: 9999;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.4s ease; max-width: 90%;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { background: linear-gradient(135deg, #4CAF50, #45a049); }
        .toast.error { background: linear-gradient(135deg, #f44336, #d32f2f); }
        .toast.info { background: linear-gradient(135deg, #667eea, #764ba2); }

        @media (max-width: 480px) {
            .info-grid { grid-template-columns: 1fr; gap: 8px; }
            .student-header .fullname { font-size: 18px; }
            input[type="text"] { font-size: 16px; }
            .info-item .v { font-size: 14px; }
        }
    </style>
</head>

        const $ = id => document.getElementById(id);

        function showToast(msg, type = 'info') {
            const t = $('toast');
            t.textContent = msg;
            t.className = 'toast ' + type + ' show';
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 3000);
        }

        function removeDiacritics(str) {
            return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                       .replace(/đ/g, 'd').replace(/Đ/g, 'D');
        }

        function fullName(s) { return `${s.ho} ${s.ten}`; }

        function searchStudents(keyword) {
            const kw = removeDiacritics(keyword.trim().toLowerCase());
            if (!kw) return [];
            return RAW.filter(s => {
                const full = removeDiacritics(fullName(s).toLowerCase());
                return full.includes(kw);
            });
        }

        function showSuggestions(keyword) {
            const box = $('suggestions');
            const kw = keyword.trim();
            if (!kw) { box.classList.remove('show'); box.innerHTML = ''; return; }

            const matches = searchStudents(kw);
            if (matches.length === 0) {
                box.innerHTML = `<div class="suggestion-empty">Không tìm thấy học sinh nào</div>`;
                box.classList.add('show');
                return;
            }

            const kwNoDiacritic = removeDiacritics(kw.toLowerCase());
            box.innerHTML = matches.slice(0, 20).map(s => {
                const full = fullName(s);
                const idx = removeDiacritics(full.toLowerCase()).indexOf(kwNoDiacritic);
                let html = '';
                if (idx >= 0) {
                    html = `${full.slice(0, idx)}<span class="hl">${full.slice(idx, idx + kw.length)}</span>${full.slice(idx + kw.length)}`;
                } else {
                    html = full;
                }
                return `<div class="suggestion-item" data-name="${full}">${html} <span class="dob-s">(${s.dob})</span></div>`;
            }).join('');
            box.classList.add('show');
        }

            let html = '';
            students.forEach(s => {
                const full = fullName(s);
                const safePhone = (s.sdt || '').replace(/'/g, "\\'");
                html += `
                    <div class="student-header">
                        <div class="label-small">Họ và tên học sinh</div>
                        <div class="fullname">${full}</div>
                        <div class="sub-line">Mã định danh: ${s.ma} · STT: ${s.stt}</div>
                    </div>

                    <div class="info-grid">
                        <div class="info-item">
                            <div class="k">Ngày sinh</div>
                            <div class="v">${s.dob}</div>
                        </div>
                        <div class="info-item">
                            <div class="k">Giới tính</div>
                            <div class="v">${s.gioitinh}</div>
                        </div>
                        <div class="info-item">
                            <div class="k">Dân tộc</div>
                            <div class="v">${s.dantoc}</div>
                        </div>
                        <div class="info-item">
                            <div class="k">Trạng thái</div>
                            <div class="v">${s.trangthai}</div>
                        </div>
                        <div class="info-item full">
                            <div class="k">Số điện thoại liên hệ</div>
                            <div class="v phone-row">
                                <span class="v mono">${s.sdt}</span>
                                <button type="button" class="btn-copy" data-phone="${s.sdt}" onclick="copyPhone('${safePhone}', this)">📋 Copy</button>
                            </div>
                        </div>
                        <div class="info-item full">
                            <div class="k">Tổ/thôn Hộ khẩu thường trú</div>
                            <div class="v">${s.diachi}</div>
                        </div>
                    </div>
                `;
            });

            area.innerHTML = html;
        }

        // Copy số điện thoại
        function copyPhone(phone, btn) {
            const done = () => {
                showToast('✅ Đã sao chép SĐT: ' + phone, 'success');
                if (btn) {
                    const old = btn.innerHTML;
                    btn.innerHTML = '✔ Đã copy';
                    btn.classList.add('copied');
                    setTimeout(() => {
                        btn.innerHTML = old;
                        btn.classList.remove('copied');
                    }, 1600);
                }
            };

            // Ưu tiên Clipboard API
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(phone).then(done).catch(() => fallbackCopy(phone, done));
            } else {
                fallbackCopy(phone, done);
            }
        }

        function fallbackCopy(text, done) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.setAttribute('readonly', '');
            ta.style.position = 'fixed';
            ta.style.top = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                done();
            } catch (e) {
                showToast('❌ Không thể sao chép. Vui lòng copy thủ công.', 'error');
            }
            document.body.removeChild(ta);
        }

        // ===== GỢI Ý =====
        const nameInput = $('nameInput');
        const suggBox = $('suggestions');

        nameInput.addEventListener('input', () => {
            nameInput.classList.remove('invalid');
            $('resultArea').classList.remove('show');
            $('resultArea').innerHTML = '';
            showSuggestions(nameInput.value);
        });

        suggBox.addEventListener('click', e => {
            const item = e.target.closest('.suggestion-item');
            if (!item) return;
            nameInput.value = item.dataset.name;
            suggBox.classList.remove('show');
            doSearch(item.dataset.name);
        });

        document.addEventListener('click', e => {
            if (!e.target.closest('.form-group')) {
                suggBox.classList.remove('show');
            }
        });

        nameInput.addEventListener('keydown', e => {
            const items = suggBox.querySelectorAll('.suggestion-item');
            if (!items.length || !suggBox.classList.contains('show')) return;

            let active = suggBox.querySelector('.suggestion-item.active');
            let idx = active ? Array.from(items).indexOf(active) : -1;

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (active) active.classList.remove('active');
                idx = (idx + 1) % items.length;
                items[idx].classList.add('active');
                items[idx].scrollIntoView({ block: 'nearest' });
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (active) active.classList.remove('active');
                idx = (idx - 1 + items.length) % items.length;
                items[idx].classList.add('active');
                items[idx].scrollIntoView({ block: 'nearest' });
            } else if (e.key === 'Enter' && active) {
                e.preventDefault();
                nameInput.value = active.dataset.name;
                suggBox.classList.remove('show');
                doSearch(active.dataset.name);
            } else if (e.key === 'Escape') {
                suggBox.classList.remove('show');
            }
        });

        // ===== TRA CỨU =====
        function doSearch(keyword) {
            const raw = (keyword || '').trim();
            if (!raw) {
                showToast('⚠️ Vui lòng nhập họ tên học sinh!', 'error');
                nameInput.classList.add('invalid'); nameInput.focus(); return;
            }
            const matches = searchStudents(raw);
            if (matches.length === 0) {
                showToast('❌ Không tìm thấy học sinh với tên này', 'error');
            } else if (matches.length === 1) {
                showToast('✅ Đã tìm thấy thông tin!', 'success');
            } else {
                showToast(`ℹ️ Có ${matches.length} học sinh phù hợp`, 'info');
            }
            nameInput.classList.remove('invalid');
            renderResult(matches);
        }

        $('searchForm').addEventListener('submit', e => {
            e.preventDefault();
            doSearch(nameInput.value);
        });
    </script>
</body>
</html>
